<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>La gran alianza de aventureros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body style="background-color: #f1ebd5;"> <div class="container" style="max-width: 700px; margin-top: 40px; margin-bottom: 50px;">
    
    <div class="card shadow" style="border: 2px solid #5a4634;">
        <div class="card-header text-white text-center" style="background-color: #5a4634;">
            <h3>Registro de aventurero</h3>
        </div>
        
        <div class="card-body" id="cuerpo_formulario" style="min-height: 250px;">
            
            <div id="caja_p1">
                <label>¿Cual es el nombre de tu personaje?</label>
                <input type="text" id="campo_p1" class="form-control" placeholder="Solo letras. Min de 3 caracteres.">
                <span id="err_p1" class="error"></span>
            </div>

            <div id="caja_p2" style="display: none;">
                <label>¿Cual es tu raza?</label>
                <select id="campo_p2" class="form-select">
                    <option value="">Elegi tu raza </option>
                    <option value="Humanos">Humanos</option>
                    <option value="Elfo">Elfos</option>
                    <option value="Enano">Enanos</option>
                    <option value="Orco">Orcos</option>
                </select>
                <span id="err_p2" class="error"></span>
            </div>

            <div id="caja_p3" style="display: none;">
                <label>¿Cual es tu clase?</label>
                <select id="campo_p3" class="form-select">
                    <option value=""> Elegi tu clase </option>
                    <option value="Guerrero">Guerrero</option>
                    <option value="Mago">Mago</option>
                    <option value="Arquero">Arquero</option>
                    <option value="Sanador">Sanador</option>
                </select>
                <span id="err_p3" class="error"></span>
            </div>

            <div id="caja_p4" style="display: none;">
                <label>¿Cual es el nombre de tu reino de origen?</label>
                <input type="text" id="campo_p4" class="form-control" placeholder="Minimo 3 letras">
                <span id="err_p4" class="error"></span>
            </div>

            <div id="caja_p5" style="display: none;">
                <label>¿Cual es el nombre de tu arma principal?</label>
                <input type="text" id="campo_p5" class="form-control" placeholder="Ej: Espada Larga, arco y fklecha, baston magico">
                <span id="err_p5" class="error"></span>
            </div>

            <div id="caja_p6" style="display: none;">
                <label>¿Cual es tu numero de registro de aventurero?</label>
                <input type="text" id="campo_p6" class="form-control" placeholder="6 dígitos exactamente " maxlength="6">
                <span id="err_p6" class="error"></span>
            </div>

            <div id="caja_p7" style="display: none;">
                <label>¿Cuantos puntos de vida (HP) tenes?</label>
                <input type="text" id="campo_p7" class="form-control" placeholder="Entre 1 y 999">
                <span id="err_p7" class="error"></span>
            </div>

            <div id="caja_p8" style="display: none;">
                <label>¿Cuantas batallas ganaste?</label>
                <input type="text" id="campo_p8" class="form-control" placeholder="Minimo 0 " >
                <span id="err_p8" class="error"></span>
            </div>

            <div id="caja_p9" style="display: none;">
                <label>¿Cuando nacio tu personaje? (Mayor de 18 años)</label>
                <input type="date" id="campo_p9" class="form-control">
                <span id="err_p9" class="error"></span>
            </div>

            <div id="caja_p10" style="display: none;">
                <label>¿Cuando comenzaste tu aventura?</label>
                <input type="date" id="campo_p10" class="form-control">
                <span id="err_p10" class="error"></span>
            </div>

            <br>
            <div id="cartel_final" style="display: none; background-color: #d1e7dd; padding: 20px; border: 2px solid #0f5132; border-radius: 8px;">
                <h4 style="color: #0f5132; text-align: center;" id="mensaje_bienvenida"></h4>
            </div>

        </div> <div class="card-footer bg-white" id="panel_botones">
            <div class="d-flex justify-content-between">
                <button id="btn_retroceder" class="btn btn-secondary" onclick="ir_atras()" disabled>Retroceder</button>
                <button id="btn_reiniciar" class="btn btn-danger" onclick="reiniciar_todo()">Reiniciar</button>
                <button id="btn_siguiente" class="btn btn-success" onclick="ir_adelante()">Siguiente</button>
            </div>
        </div>
        
    </div> 
</div> 

<script src="js/app.js"></script>
</body>
</html>
